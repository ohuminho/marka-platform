name: MARKA Android TWA validation

on:
  pull_request:
    paths:
      - "src/app/manifest.ts"
      - "public/marka-icon*.svg"
      - "android-twa/**"
      - ".github/workflows/android-twa-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/app/manifest.ts"
      - "public/marka-icon*.svg"
      - "android-twa/**"
      - ".github/workflows/android-twa-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marka-android-twa-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pwa-for-twa:
    name: Validate MARKA PWA for Trusted Web Activity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Configure Bubblewrap without prompts
        run: |
          mkdir -p "$HOME/.bubblewrap" /tmp/android-sdk
          printf '{"jdkPath":"%s","androidSdkPath":"/tmp/android-sdk"}\n' "$JAVA_HOME" > "$HOME/.bubblewrap/config.json"
      - name: Validate MARKA PWA for TWA
        env:
          PR_PREVIEW_URL: https://marka-platform-git-feat-android-twa-play-store-setup-ohuminho.vercel.app
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            TARGET_URL="$PR_PREVIEW_URL"
          else
            TARGET_URL="https://markaao.com"
          fi
          bubblewrap validate --url="$TARGET_URL"
