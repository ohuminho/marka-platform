name: MARKA Android TWA validation

on:
  pull_request:
    paths:
      - "src/app/manifest.ts"
      - "public/marka-icon*.svg"
      - "public/sw.js"
      - "public/offline.html"
      - "android-twa/**"
      - ".github/workflows/android-twa-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/app/manifest.ts"
      - "public/marka-icon*.svg"
      - "public/sw.js"
      - "public/offline.html"
      - "android-twa/**"
      - ".github/workflows/android-twa-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marka-android-twa-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pwa-for-twa:
    name: Validate MARKA PWA endpoints for TWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate deployed PWA resources
        env:
          PR_PREVIEW_URL: https://marka-platform-git-feat-android-twa-play-store-setup-ohuminho.vercel.app
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_URL="$PR_PREVIEW_URL"
          else
            BASE_URL="https://markaao.com"
          fi
          BASE_URL="${BASE_URL%/}"
          echo "Checking deployed MARKA PWA at $BASE_URL"

          curl --fail --silent --show-error "$BASE_URL/manifest.webmanifest" -o /tmp/manifest.json
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json', 'utf8'));
          const required = ['name', 'short_name', 'start_url', 'display', 'icons'];
          for (const key of required) {
            if (!manifest[key]) throw new Error('Manifest missing required field: ' + key);
          }
          if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) {
            throw new Error('Manifest must define at least one icon');
          }
          for (const icon of manifest.icons) {
            if (!icon.src || !icon.sizes || !icon.type) {
              throw new Error('Manifest icon is missing src, sizes, or type');
            }
          }
          console.log('Manifest structure OK:', manifest.name);
          console.log('Icons declared:', manifest.icons.length);
          NODE

          for path in /marka-icon-192.svg /marka-icon.svg /marka-icon-maskable.svg /sw.js /offline.html; do
            echo "Checking $path"
            curl --fail --silent --show-error --output /dev/null "$BASE_URL$path"
          done

          grep -q 'start_url' /tmp/manifest.json
          echo "MARKA PWA endpoint validation passed."
