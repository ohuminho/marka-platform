name: MARKA Automation Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: marka-automation-worker
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  process-pending-events:
    name: Process pending automation events
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=marka-automation")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Process MARKA automation queue
        env:
          MARKA_AUTOMATION_URL: ${{ vars.MARKA_AUTOMATION_URL || 'https://markaao.com' }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MARKA_AUTOMATION_URL"
          curl --fail-with-body --silent --show-error \
            --max-time 45 \
            -X POST "${MARKA_AUTOMATION_URL%/}/api/internal/automation/process" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":5}'
