name: MARKA CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: marka-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marka_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marka_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/marka_test?schema=public
      RUN_PHONE_OTP_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Bootstrap Supabase Storage catalog for migrations
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/integration/bootstrap-supabase-storage.sql

      - name: Apply migrations to isolated PostgreSQL
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: MARKA phone OTP PostgreSQL integration tests
        run: npm run test:integration:phone-otp

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
