services:
  osrm-angola:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:latest}
    container_name: marka-osrm-angola
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --threads
      - ${OSRM_THREADS:-2}
      - /data/angola-latest.osrm
    restart: unless-stopped
    ports:
      # Keep the routing engine private. Put an authenticated HTTPS reverse proxy in front
      # before connecting Vercel/production traffic.
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data:/data:ro
    security_opt:
      - no-new-privileges:true
