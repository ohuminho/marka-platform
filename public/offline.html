<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070707">
    <title>MARKA | Sem ligação</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #070707; color: #f5f5f5; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); text-align: center; }
      img { width: 88px; height: 88px; }
      h1 { margin: 24px 0 8px; font-size: clamp(1.5rem, 5vw, 2rem); }
      p { color: #b7b7b7; line-height: 1.6; }
      button { margin-top: 20px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #e9bd58; color: #070707; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/marka-icon.svg" alt="MARKA">
      <h1>Sem ligação à internet</h1>
      <p>A MARKA precisa de ligação para carregar a tua conta e os serviços. Verifica a ligação e tenta novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
